---
layout: default
---
<article class="post">

  <header class="mb-8 pb-6 border-b border-outline-variant/15">
    <div class="mb-2">
      <a class="text-xs font-medium text-primary hover:underline inline-flex items-center gap-1" href="{{ '/' | relative_url }}">
        <span>←</span>
        <span>Back to Home</span>
      </a>
    </div>
    <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight text-on-surface">{{ page.title }}</h1>
  </header>

  <div
    class="post-content text-on-surface leading-relaxed [&>h2]:mt-10 [&>h2]:mb-4 [&>h2]:border-l-4 [&>h2]:border-primary [&>h2]:pl-4 [&>h2]:text-2xl [&>h2]:font-bold [&>h2]:tracking-tight [&>h2]:text-on-surface [&>h3]:mt-8 [&>h3]:mb-3 [&>h3]:text-xl [&>h3]:font-bold [&>h3]:text-on-surface [&>p]:my-4 [&>ul]:my-4 [&>ul]:list-disc [&>ul]:pl-6 [&>ul>li]:my-2">
    {{ content }}
  </div>

</article>
