<link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/favicon.png' | relative_url }}">

<script>
  (function () {
    var storageKey = 'wl-docs-theme';
    var saved = null;
    try {
      saved = localStorage.getItem(storageKey);
    } catch (e) { }
    var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    var theme = saved === 'dark' || saved === 'light' ? saved : (prefersDark ? 'dark' : 'light');
    var root = document.documentElement;
    root.setAttribute('data-theme', theme);
    root.classList.toggle('dark', theme === 'dark');
  })();
</script>

<link rel="stylesheet" href="{{ '/assets/css/tailwind.css' | relative_url }}?v={{ site.time | date: '%s' }}">

<script>
  (function () {
    var storageKey = 'wl-docs-theme';

    function applyTheme(theme) {
      var root = document.documentElement;
      var isDark = theme === 'dark';
      root.setAttribute('data-theme', isDark ? 'dark' : 'light');
      root.classList.toggle('dark', isDark);

      var toggles = document.querySelectorAll('[data-theme-toggle]');
      var label = isDark ? 'Switch to light mode' : 'Switch to dark mode';

      toggles.forEach(function (toggle) {
        toggle.setAttribute('aria-pressed', String(isDark));
        toggle.setAttribute('aria-label', label);
        toggle.setAttribute('title', label);
      });
    }

    var transitionTimeout = null;
    function toggleTheme() {
      var root = document.documentElement;
      var current = root.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
      var next = current === 'dark' ? 'light' : 'dark';

      root.classList.add('theme-transitioning');
      clearTimeout(transitionTimeout);
      transitionTimeout = setTimeout(function () {
        root.classList.remove('theme-transitioning');
      }, 350);

      try {
        localStorage.setItem(storageKey, next);
      } catch (error) {
        // Ignore storage errors in private browsing contexts.
      }

      applyTheme(next);
    }

    document.addEventListener('DOMContentLoaded', function () {
      var currentTheme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
      applyTheme(currentTheme);

      var toggles = document.querySelectorAll('[data-theme-toggle]');
      toggles.forEach(function (toggle) {
        toggle.addEventListener('click', toggleTheme);
      });
    });
  })();
</script>

<!-- JSON-LD: Organization entity for publisher signals -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "@id": {{ '/' | absolute_url | append: '#organization' | jsonify }},
  "name": "Watch Later Button",
  "url": {{ '/' | absolute_url | jsonify }},
  "logo": {
    "@type": "ImageObject",
    "url": {{ '/assets/favicon.png' | absolute_url | jsonify }}
  },
  "sameAs": [
    {{ site.data.stores.chrome_url | jsonify }},
    {{ site.data.stores.edge_url | jsonify }},
    {{ site.data.stores.firefox_url | jsonify }},
    {{ site.data.stores.github_url | jsonify }},
    {{ site.data.stores.donate_url | jsonify }}
  ],
  "contactPoint": [
    {
      "@type": "ContactPoint",
      "contactType": "customer support",
      "url": {{ site.data.stores.issues_url | jsonify }}
    }
  ]
}
</script>

{% if page.layout == 'home' %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "Is it really free and open source?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes, Watch Later Button is 100% free and open-source under the GNU General Public License v3.0 (GPL-3.0). There are no paid tiers, no ads, and no hidden subscriptions."
      }
    },
    {
      "@type": "Question",
      "name": "How do I customize the button color and transparency?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Click the Watch Later Button icon in your browser toolbar to open the popup, then select Settings. You can choose any HEX or RGB color, adjust the opacity slider from 0% to 100%, and preview changes immediately in the popup. All open YouTube tabs update live in real-time."
      }
    },
    {
      "@type": "Question",
      "name": "Can I undo if I click the button by mistake?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "After YouTube confirms a save, click the same button again during the undo countdown to request removal. The default window is 10 seconds; Settings lets you choose 15 seconds, a custom duration from 1 to 60 seconds, or Off. After the window ends, the button returns to saving mode."
      }
    },
    {
      "@type": "Question",
      "name": "Does the extension collect or transmit my data?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "The extension has no analytics and does not send your viewing activity to the developer. Saving and undoing videos use YouTube's existing client interface. Preferences are stored locally and in browser sync storage; when browser-account sync is enabled, your browser may synchronize those preferences across devices."
      }
    },
    {
      "@type": "Question",
      "name": "Which browsers and platforms are supported?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Watch Later Button supports Google Chrome, Mozilla Firefox, Microsoft Edge, Brave, Opera, and Vivaldi on Windows, macOS, and Linux."
      }
    },
    {
      "@type": "Question",
      "name": "Does it work on YouTube Shorts and video cards?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes! The button is automatically injected into standard video watch pages, YouTube Shorts player controls, and thumbnail cards across home, subscriptions, and search feeds."
      }
    }
  ]
}
</script>
{% endif %}

}
</script>
