{%- assign current_url = page.url | default: "" -%}

{%- if page.layout == "home" -%}
<nav class="fixed top-0 w-full z-50 bg-surface/90 backdrop-blur-md border-b border-outline-variant/15 shadow-sm" aria-label="Main Navigation">
    <div class="flex justify-between items-center px-4 sm:px-6 py-3.5 max-w-7xl mx-auto">
        <div class="text-lg font-bold text-on-surface tracking-tight">
            <a href="{{ '/' | relative_url }}" class="focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2 focus:outline-none rounded-md">Watch Later Button</a>
        </div>
        <div class="hidden md:flex items-center gap-7 text-sm font-medium text-on-surface-variant">
            <a class="hover:text-on-surface transition-colors focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2 focus:outline-none rounded-md px-1.5 py-1"
                href="#how-it-works">How it works</a>
            <a class="hover:text-on-surface transition-colors focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2 focus:outline-none rounded-md px-1.5 py-1"
                href="#features">Features</a>
            <a class="hover:text-on-surface transition-colors focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2 focus:outline-none rounded-md px-1.5 py-1"
                href="#faq">FAQ</a>
            <a class="hover:text-on-surface transition-colors focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2 focus:outline-none rounded-md px-1.5 py-1"
                href="{{ '/updates/' | relative_url }}">Updates</a>
        </div>
        <div class="flex items-center gap-3">
            <button type="button"
                class="theme-toggle inline-flex items-center justify-center w-9 h-9 rounded-full border border-outline-variant/20 text-on-surface-variant hover:bg-surface-container-high focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2 focus:outline-none transition-colors"
                data-theme-toggle aria-label="Toggle theme" aria-pressed="false" title="Toggle theme">
                <span class="material-symbols-outlined text-base" data-theme-icon data-icon="dark_mode">dark_mode</span>
            </button>
        </div>
    </div>
    <div class="md:hidden px-4 pb-3 flex items-center justify-between border-t border-outline-variant/10 pt-2 text-xs font-medium text-on-surface-variant">
        <a class="hover:text-on-surface px-2 py-1 rounded transition-colors focus-visible:ring-2 focus-visible:ring-primary focus:outline-none"
            href="#how-it-works">How it works</a>
        <a class="hover:text-on-surface px-2 py-1 rounded transition-colors focus-visible:ring-2 focus-visible:ring-primary focus:outline-none"
            href="#features">Features</a>
        <a class="hover:text-on-surface px-2 py-1 rounded transition-colors focus-visible:ring-2 focus-visible:ring-primary focus:outline-none"
            href="#faq">FAQ</a>
        <a class="hover:text-on-surface px-2 py-1 rounded transition-colors focus-visible:ring-2 focus-visible:ring-primary focus:outline-none"
            href="{{ '/updates/' | relative_url }}">Updates</a>
    </div>
</nav>
{%- else -%}
<nav class="fixed top-0 w-full z-50 bg-surface/90 backdrop-blur-md border-b border-outline-variant/15 shadow-sm" aria-label="Main Navigation">
    <div class="flex justify-between items-center px-4 sm:px-6 py-3.5 max-w-7xl mx-auto">
        <div class="text-lg font-bold text-on-surface tracking-tight">
            <a href="{{ '/' | relative_url }}" class="focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2 focus:outline-none rounded-md">Watch Later Button</a>
        </div>
        <div class="hidden md:flex items-center gap-7 text-sm font-medium">
            <a class="{% if current_url == '/' %}text-primary font-semibold{% else %}text-on-surface-variant hover:text-on-surface{% endif %} transition-colors focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2 focus:outline-none rounded-md px-1.5 py-1"
                href="{{ '/' | relative_url }}">Home</a>
            <a class="{% if current_url contains '/privacy/' %}text-primary font-semibold{% else %}text-on-surface-variant hover:text-on-surface{% endif %} transition-colors focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2 focus:outline-none rounded-md px-1.5 py-1"
                href="{{ '/privacy/' | relative_url }}">Privacy</a>
            <a class="{% if current_url contains '/impressum/' %}text-primary font-semibold{% else %}text-on-surface-variant hover:text-on-surface{% endif %} transition-colors focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2 focus:outline-none rounded-md px-1.5 py-1"
                href="{{ '/impressum/' | relative_url }}">Impressum</a>
            <a class="{% if current_url contains '/updates/' %}text-primary font-semibold{% else %}text-on-surface-variant hover:text-on-surface{% endif %} transition-colors focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2 focus:outline-none rounded-md px-1.5 py-1"
                href="{{ '/updates/' | relative_url }}">Updates</a>
        </div>
        <div class="flex items-center gap-3">
            <button type="button"
                class="theme-toggle inline-flex items-center justify-center w-9 h-9 rounded-full border border-outline-variant/20 text-on-surface-variant hover:bg-surface-container-high focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2 focus:outline-none transition-colors"
                data-theme-toggle aria-label="Toggle theme" aria-pressed="false" title="Toggle theme">
                <span class="material-symbols-outlined text-base" data-theme-icon data-icon="dark_mode">dark_mode</span>
            </button>
        </div>
    </div>
    <div class="md:hidden px-4 pb-3 flex items-center justify-between text-xs font-medium border-t border-outline-variant/10 pt-2">
        <a class="{% if current_url == '/' %}text-primary font-semibold{% else %}text-on-surface-variant{% endif %} px-2 py-1 rounded focus-visible:ring-2 focus-visible:ring-primary focus:outline-none"
            href="{{ '/' | relative_url }}">Home</a>
        <a class="{% if current_url contains '/privacy/' %}text-primary font-semibold{% else %}text-on-surface-variant{% endif %} px-2 py-1 rounded focus-visible:ring-2 focus-visible:ring-primary focus:outline-none"
            href="{{ '/privacy/' | relative_url }}">Privacy</a>
        <a class="{% if current_url contains '/impressum/' %}text-primary font-semibold{% else %}text-on-surface-variant{% endif %} px-2 py-1 rounded focus-visible:ring-2 focus-visible:ring-primary focus:outline-none"
            href="{{ '/impressum/' | relative_url }}">Impressum</a>
        <a class="{% if current_url contains '/updates/' %}text-primary font-semibold{% else %}text-on-surface-variant{% endif %} px-2 py-1 rounded focus-visible:ring-2 focus-visible:ring-primary focus:outline-none"
            href="{{ '/updates/' | relative_url }}">Updates</a>
    </div>
</nav>
{%- endif -%}
