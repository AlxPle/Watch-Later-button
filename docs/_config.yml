title: Watch Later Button
description: Save YouTube videos to Watch Later in one click. Clean, minimal, privacy-first browser extension. No data collection. Available in 26 languages.
author: Alex Pletnov
lang: en
google_tag_manager_id: GTM-TB8PQ6FT

url: "https://watchlater.alxple.com"  # Production domain (no trailing slash)
baseurl: ""  # Empty for root domain deployments

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

feed:
  path: feed.xml

permalink: /updates/:year/:month/:day/:title/

kramdown:
  smart_quotes: lsquo,rsquo,ldquo,rdquo

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: Alex Pletnov

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle
  - .bundle
  - .sass-cache
  - .jekyll-cache
  - README.md
  - LICENSE
  - .gitignore
  - package.json
  - package-lock.json
  - scripts
  - tailwind.config.js
  - assets/css/tailwind-input.css
  - _config_dev.yml
  - "**/*.tmp.*"
