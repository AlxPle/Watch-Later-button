<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title id="title">Watch Later Button</title>
	<link rel="preload" href="../assets/fonts/inter-latin-400.woff2" as="font" type="font/woff2" crossorigin>
	<link rel="preload" href="../assets/fonts/manrope-latin-700.woff2" as="font" type="font/woff2" crossorigin>
	<link rel="stylesheet" href="../assets/styles/style.css">
	<link rel="stylesheet" href="popup.css">
</head>

<body>
	<main class="popup-container">
		<div class="views-slider" id="views-slider">
			<!-- Main View -->
			<section id="main-view" class="view-panel is-active">
				<!-- Header -->
				<header class="popup-header">
					<div class="brand-group">
						<img class="header-logo" src="../assets/app-icons/red/iconmonstr-text-plus-lined-32.png"
							alt="Watch Later Button Logo" width="22" height="22">
						<h1 class="extension-name" id="extension-name" data-i18n="extensionName">Watch Later Button</h1>
					</div>
				</header>

				<!-- Hero Action: Watch Later Playlist -->
				<a id="watch-later-link" href="https://www.youtube.com/playlist?list=WL" class="hero-card" target="_blank" rel="noopener noreferrer">
					<div class="hero-icon-wrapper">
						<svg class="hero-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
							<path d="M19 9H2v2h17V9zm0-4H2v2h17V5zM2 15h13v-2H2v2zm15-2v6l5-3-5-3z"/>
						</svg>
					</div>
					<div class="hero-content">
						<span class="hero-title" id="open-watch-later" data-i18n="openWatchLater">Watch Later</span>
						<span class="hero-subtitle" id="open-playlist-direct" data-i18n="openPlaylistDirect">Open saved videos</span>
					</div>
					<svg class="hero-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
						<polyline points="9 18 15 12 9 6"></polyline>
					</svg>
				</a>

				<!-- Dedicated Settings Item -->
				<button type="button" class="settings-row-btn" id="open-settings-row-btn">
					<div class="settings-row-left">
						<svg class="btn-icon" viewBox="0 -960 960 960" aria-hidden="true">
							<path d="m370-80-16-128q-13-5-24.5-12T307-235l-119 50L78-375l103-78q-1-7-1-13.5v-27q0-6.5 1-13.5L78-585l110-190 119 50q11-8 23-15t24-12L370-880h220l16 128q13 5 24.5 12t22.5 15l119-50 110 190-103 78q1 7 1 13.5v27q0 6.5-2 13.5l103 78-110 190-118-50q-11 8-23 15t-24 12L590-80H370Zm110-280q50 0 85-35t35-85q0-50-35-85t-85-35q-50 0-85 35t-35 85q0 50 35 85t85 35Z"/>
						</svg>
						<span data-i18n="settings">Settings</span>
					</div>
					<svg class="row-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
						<polyline points="9 18 15 12 9 6"></polyline>
					</svg>
				</button>

				<!-- Action Grid -->
				<div class="action-grid">
					<a id="feedback-link" href="{{REVIEWS_URL}}"
						class="grid-btn" target="_blank" rel="noopener noreferrer">
						<svg class="btn-icon" viewBox="0 -960 960 960" aria-hidden="true">
							<path d="m320-240 160-122 160 122-60-198 160-114H544l-64-208-64 208H220l160 114-60 198ZM480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Z" />
						</svg>
						<span id="feedback" data-i18n="feedback">Feedback</span>
					</a>

					<a id="donate-link" href="https://www.buymeacoffee.com/pletnovalex" class="grid-btn" target="_blank"
						rel="noopener noreferrer">
						<svg class="btn-icon" viewBox="0 -960 960 960" aria-hidden="true">
							<path d="M160-120v-80h640v80H160Zm160-160q-66 0-113-47t-47-113v-400h640q33 0 56.5 23.5T880-760v120q0 33-23.5 56.5T800-560h-80v120q0 66-47 113t-113 47H320Zm0-80h240q33 0 56.5-23.5T640-440v-320H240v320q0 33 23.5 56.5T320-360Zm400-280h80v-120h-80v120ZM320-360h-80 400-320Z" />
						</svg>
						<span id="donate" data-i18n="donate">Donate</span>
					</a>

					<a id="issues-link" href="{{SUPPORT_URL}}"
						class="grid-btn" target="_blank" rel="noopener noreferrer">
						<svg class="btn-icon" viewBox="0 -960 960 960" aria-hidden="true">
							<path d="M480-200q66 0 113-47t47-113v-160q0-66-47-113t-113-47q-66 0-113 47t-47 113v160q0 66 47 113t113 47Zm-80-120h160v-80H400v80Zm0-160h160v-80H400v80Zm80 40Zm0 320q-65 0-120.5-32T272-240H160v-80h84q-3-20-3.5-40t-.5-40h-80v-80h80q0-20 .5-40t3.5-40h-84v-80h112q14-23 31.5-43t40.5-35l-64-66 56-56 86 86q28-9 57-9t57 9l88-86 56 56-66 66q23 15 41.5 34.5T688-640h112v80h-84q3 20 3.5 40t.5 40h80v80h-80q0 20-.5 40t-3.5 40h84v80H688q-32 56-87.5 88T480-120Z" />
						</svg>
						<span id="issues" data-i18n="issues">Issues</span>
					</a>

					<a id="website-link" href="https://watchlater.alxple.com/" class="grid-btn" target="_blank" rel="noopener noreferrer">
						<svg class="btn-icon" viewBox="0 -960 960 960" aria-hidden="true">
							<path d="M325-111.5q-73-31.5-127.5-86t-86-127.5Q80-398 80-480.5t31.5-155q31.5-72.5 86-127t127.5-86Q398-880 480.5-880t155 31.5q72.5 31.5 127 86t86 127Q880-563 880-480.5T848.5-325q-31.5 73-86 127.5t-127 86Q563-80 480.5-80T325-111.5ZM480-162q26-36 45-75t31-83H404q12 44 31 83t45 75Zm-104-16q-18-33-31.5-68.5T322-320H204q29 50 72.5 87t99.5 55Zm208 0q56-18 99.5-55t72.5-87H638q-9 38-22.5 73.5T584-178ZM170-400h136q-3-20-4.5-39.5T300-480q0-21 1.5-40.5T306-560H170q-5 20-7.5 39.5T160-480q0 21 2.5 40.5T170-400Zm216 0h188q3-20 4.5-39.5T580-480q0-21-1.5-40.5T574-560H386q-3 20-4.5 39.5T380-480q0 21 1.5 40.5T386-400Zm268 0h136q5-20 7.5-39.5T800-480q0-21-2.5-40.5T790-560H654q3 20 4.5 39.5T660-480q0 21-1.5 40.5T654-400Zm-16-240h118q-29-50-72.5-87T584-782q18 33 31.5 68.5T638-640Zm-234 0h152q-12-44-31-83t-45-75q-26 36-45 75t-31 83Zm-200 0h118q9-38 22.5-73.5T376-782q-56 18-99.5 55T204-640Z" />
						</svg>
						<span id="website" data-i18n="website">Website</span>
					</a>
				</div>
			</section>

			<!-- Settings View -->
			<section id="settings-view" class="view-panel" inert>
				<div class="settings-nav">
					<button type="button" class="back-btn" id="back-to-main-btn" aria-label="Back">
						<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
							<polyline points="15 18 9 12 15 6"></polyline>
						</svg>
						<span data-i18n="settingsBack">Back</span>
					</button>
					<h2 class="settings-title" data-i18n="settings">Settings</h2>
				</div>

				<div class="settings-sections">
					<!-- Zone 1: Appearance -->
					<div class="settings-group">
						<div class="settings-group-header">
							<svg class="group-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
								<circle cx="12" cy="12" r="10"></circle>
								<path d="M12 2a7 7 0 0 0 0 14 3.5 3.5 0 0 0 3.5-3.5c0-.62-.25-1.2-.67-1.62l-.71-.71A2 2 0 0 1 14 9V8a2 2 0 0 1 2-2h1a5 5 0 0 1 5 5"></path>
							</svg>
							<span data-i18n="settingsGroupAppearance">Appearance</span>
						</div>

						<div class="settings-card">
							<!-- Mini YouTube Player Preview -->
							<div class="preview-player-mock">
								<div id="btn-preview" class="saveToWatchLater" role="button" tabindex="0"></div>
								<span class="player-badge" aria-hidden="true">12:45</span>
								<div class="player-progress" aria-hidden="true">
									<div class="player-progress-fill"></div>
								</div>
							</div>

							<!-- Quick Color Swatches -->
							<div class="control-row">
								<label for="color-picker" class="control-label" data-i18n="settingsColor">Button color</label>
								<div class="color-presets" role="group" aria-label="Color presets">
									<button type="button" class="preset-chip active" data-color="#e50914" style="--chip-color: #e50914" title="YouTube Red" aria-label="YouTube Red"></button>
									<button type="button" class="preset-chip is-light" data-color="#ffffff" style="--chip-color: #ffffff" title="Pure White" aria-label="Pure White"></button>
									<button type="button" class="preset-chip" data-color="#3ea6ff" style="--chip-color: #3ea6ff" title="Ambient Blue" aria-label="Ambient Blue"></button>
									<button type="button" class="preset-chip" data-color="#2ba640" style="--chip-color: #2ba640" title="Emerald Green" aria-label="Emerald Green"></button>
									<button type="button" class="preset-chip preset-custom" id="custom-swatch-btn" title="Custom color" aria-label="Custom color">
										<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
											<path d="M12 20h9"></path>
											<path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
										</svg>
									</button>
								</div>
							</div>

							<div class="control-row">
								<span class="control-sublabel">HEX</span>
								<div class="color-picker-group">
									<input type="color" id="color-picker" value="#e50914" aria-label="Button color">
									<input type="text" id="color-hex" value="#e50914" spellcheck="false" class="hex-field" maxlength="9" aria-label="Hex color">
								</div>
							</div>

							<div class="control-group">
								<div class="slider-meta">
									<label for="opacity-slider" class="control-label" data-i18n="settingsOpacity">Opacity</label>
									<span id="opacity-val" class="slider-value">100%</span>
								</div>
								<input type="range" id="opacity-slider" min="0" max="100" value="100" class="range-slider">
							</div>

							<div class="control-group">
								<div class="rgba-copy-wrap" id="rgba-copy-wrap">
									<input type="text" id="rgba-output" readonly class="rgba-field" aria-label="RGBA CSS value">
									<span class="rgba-copy-icon" aria-hidden="true">
										<svg class="icon-copy" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
											<rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
											<path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
										</svg>
										<svg class="icon-check" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
											<polyline points="20 6 9 17 4 12"></polyline>
										</svg>
									</span>
								</div>
							</div>
						</div>
					</div>

					<!-- Zone 2: Controls & Timing -->
					<div class="settings-group">
						<div class="settings-group-header">
							<svg class="group-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
								<rect x="2" y="4" width="20" height="16" rx="2"></rect>
								<path d="M6 8h.01M10 8h.01M14 8h.01M18 8h.01M6 12h.01M10 12h.01M14 12h.01M18 12h.01M7 16h10"></path>
							</svg>
							<span data-i18n="settingsGroupControls">Controls & Timing</span>
						</div>

						<div class="settings-card">
							<!-- Hotkey Setting -->
							<div class="control-group">
								<div class="control-row">
									<span class="control-label" data-i18n="settingsShortcut">Keyboard shortcut</span>
									<button type="button" id="shortcut-btn" class="shortcut-badge" aria-label="Keyboard shortcut">Alt + W</button>
								</div>
								<span id="shortcut-hint" class="settings-hint" hidden data-i18n="settingsShortcutHint">Press key combination or Esc to cancel</span>
							</div>

							<div class="settings-card-divider"></div>

							<!-- Undo Timer Setting (Segmented Control) -->
							<div class="control-group">
								<div class="control-row">
									<span class="control-label" data-i18n="settingsUndo">Undo timer</span>
									<span id="undo-active-badge" class="slider-value">10s</span>
								</div>
								<div class="undo-pill-group" id="undo-pill-group" role="group" aria-label="Undo timer duration">
									<div class="undo-active-thumb" id="undo-active-thumb" aria-hidden="true"></div>
									<button type="button" class="undo-pill" data-index="0" data-seconds="0" data-i18n="undoOff">Off</button>
									<button type="button" class="undo-pill active" data-index="1" data-seconds="10">10s</button>
									<button type="button" class="undo-pill" data-index="2" data-seconds="15">15s</button>
									<button type="button" class="undo-pill" data-index="3" data-seconds="custom" data-i18n="undoCustom">Custom</button>
								</div>
								<div id="custom-undo-container" class="custom-stepper-card" hidden>
									<span class="stepper-label" data-i18n="customDuration">Duration (1–60s)</span>
									<div class="stepper-controls">
										<button type="button" class="stepper-btn" id="undo-step-down" aria-label="Decrease">−</button>
										<div class="stepper-val-wrap">
											<input type="number" id="custom-undo-input" class="stepper-input" min="1" max="60" value="7" aria-label="Custom seconds">
											<span class="stepper-unit" data-i18n="secondsUnit">sec</span>
										</div>
										<button type="button" class="stepper-btn" id="undo-step-up" aria-label="Increase">+</button>
									</div>
								</div>
							</div>
						</div>
					</div>

					<!-- Zone 3: Surfaces -->
					<div class="settings-group">
						<div class="settings-group-header">
							<svg class="group-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
								<rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
								<line x1="8" y1="21" x2="16" y2="21"></line>
								<line x1="12" y1="17" x2="12" y2="21"></line>
							</svg>
							<span data-i18n="settingsGroupSurfaces">Surfaces</span>
						</div>

						<div class="settings-card">
							<label for="surface-watch-toggle" class="control-row toggle-row">
								<span class="toggle-text">
									<span class="control-label" data-i18n="settingsSurfaceWatch">Video player</span>
									<span class="control-sublabel" data-i18n="settingsSurfaceWatchDesc">Show button on watch page</span>
								</span>
								<span class="switch">
									<input type="checkbox" id="surface-watch-toggle" role="switch" aria-checked="true" checked>
									<span class="switch-slider"></span>
								</span>
							</label>

							<div class="settings-card-divider"></div>

							<label for="surface-shorts-toggle" class="control-row toggle-row">
								<span class="toggle-text">
									<span class="control-label" data-i18n="settingsSurfaceShorts">YouTube Shorts</span>
									<span class="control-sublabel" data-i18n="settingsSurfaceShortsDesc">Show button on Shorts</span>
								</span>
								<span class="switch">
									<input type="checkbox" id="surface-shorts-toggle" role="switch" aria-checked="true" checked>
									<span class="switch-slider"></span>
								</span>
							</label>

							<div class="settings-card-divider"></div>

							<label for="surface-cards-toggle" class="control-row toggle-row">
								<span class="toggle-text">
									<span class="control-label" data-i18n="settingsSurfaceCards">Video cards</span>
									<span class="control-sublabel" data-i18n="settingsSurfaceCardsDesc">Show button on thumbnails</span>
								</span>
								<span class="switch">
									<input type="checkbox" id="surface-cards-toggle" role="switch" aria-checked="true" checked>
									<span class="switch-slider"></span>
								</span>
							</label>
						</div>
					</div>

					<!-- Zone 4: Notifications -->
					<div class="settings-group">
						<div class="settings-group-header">
							<svg class="group-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
								<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
								<path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
							</svg>
							<span data-i18n="settingsGroupNotifications">Notifications</span>
						</div>

						<div class="settings-card">
							<label for="update-notification-toggle" class="control-row toggle-row">
								<span class="toggle-text">
									<span class="control-label" data-i18n="settingsUpdateNotifications">Update notifications</span>
									<span class="control-sublabel" data-i18n="settingsUpdateNotificationsDesc">Show What's new tab after updates</span>
								</span>
								<span class="switch">
									<input type="checkbox" id="update-notification-toggle" role="switch" aria-checked="true" checked>
									<span class="switch-slider"></span>
								</span>
							</label>
						</div>
					</div>

					<!-- Reset Action -->
					<button type="button" id="reset-color-btn" class="reset-btn">
						<svg class="icon-reset" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
							<polyline points="1 4 1 10 7 10"></polyline>
							<path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
						</svg>
						<svg class="icon-check" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
							<polyline points="20 6 9 17 4 12"></polyline>
						</svg>
						<span data-i18n="settingsReset">Reset to default</span>
					</button>
				</div>
			</section>
		</div>

		<!-- Footer -->
		<footer class="popup-footer">
			<span id="ext-version">v-</span>
			<span class="footer-separator">•</span>
			<a id="whats-new" class="footer-link" href="https://watchlater.alxple.com/updates/" target="_blank"
				rel="noopener noreferrer" data-i18n="whatsNew">What's new</a>
		</footer>
	</main>
	<script src="popup.js"></script>
</body>

</html>
